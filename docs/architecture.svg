<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 810" width="1340" height="810" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5160"/></marker></defs><rect width="1340" height="810" fill="#FFFFFF"/><text x="30" y="30" font-size="16" font-weight="700" fill="#1F2430">Архитектура SecondBrain</text><text x="30" y="48" font-size="12" fill="#4A5160">Своего сервера нет. Все данные лежат на устройстве, наружу уходит только шифр.</text><rect x="30" y="70" width="900" height="570" rx="14" fill="#F4FBF8" stroke="#1F8F72" stroke-width="1.6" stroke-dasharray="8 5"/><text x="46" y="94" font-size="13" font-weight="700" fill="#1F2430">Устройство пользователя: телефон или компьютер</text><text x="914" y="94" text-anchor="end" font-size="11" fill="#4A5160">один и тот же код</text><rect x="60" y="112" width="520" height="90" rx="10" fill="#D8F1EA" stroke="#1F8F72" stroke-width="1.6"/><text x="72" y="134" font-size="15" font-weight="700" fill="#1F2430">Интерфейс</text><line x1="60" y1="142" x2="580" y2="142" stroke="#1F8F72" stroke-width="1"/><text x="72" y="160" font-size="12" fill="#2A3040">React. Экраны: запись, лента, дополнение,</text><text x="72" y="176" font-size="12" fill="#2A3040">досье, план, настройки</text><text x="72" y="192" font-size="12" fill="#2A3040">Ставится из браузера (PWA), на Android ещё APK</text><rect x="60" y="250" width="520" height="90" rx="10" fill="#D8F1EA" stroke="#1F8F72" stroke-width="1.6"/><text x="72" y="272" font-size="15" font-weight="700" fill="#1F2430">Логика</text><line x1="60" y1="280" x2="580" y2="280" stroke="#1F8F72" stroke-width="1"/><text x="72" y="298" font-size="12" fill="#2A3040">TypeScript. Время с точностью, связи, поиск,</text><text x="72" y="314" font-size="12" fill="#2A3040">подсказки людей и дат без нейросети,</text><text x="72" y="330" font-size="12" fill="#2A3040">расписание задач</text><rect x="60" y="388" width="520" height="74" rx="10" fill="#D8F1EA" stroke="#1F8F72" stroke-width="1.6"/><text x="72" y="410" font-size="15" font-weight="700" fill="#1F2430">Хранилище на устройстве</text><line x1="60" y1="418" x2="580" y2="418" stroke="#1F8F72" stroke-width="1"/><text x="72" y="436" font-size="12" fill="#2A3040">IndexedDB через Dexie. Записи, карточки, связи,</text><text x="72" y="452" font-size="12" fill="#2A3040">задачи, теги, настройки и журнал изменений</text><rect x="60" y="510" width="520" height="74" rx="10" fill="#D8F1EA" stroke="#1F8F72" stroke-width="1.6"/><text x="72" y="532" font-size="15" font-weight="700" fill="#1F2430">Без интернета работает почти всё</text><line x1="60" y1="540" x2="580" y2="540" stroke="#1F8F72" stroke-width="1"/><text x="72" y="558" font-size="12" fill="#2A3040">Записать, найти, дополнить, открыть досье, план.</text><text x="72" y="574" font-size="12" fill="#2A3040">Нужна сеть только для отправки в Диск и для помощника</text><rect x="620" y="250" width="280" height="106" rx="10" fill="#FFEFC9" stroke="#C98A00" stroke-width="1.6" stroke-dasharray="6 4"/><text x="632" y="272" font-size="15" font-weight="700" fill="#1F2430">Помощник</text><line x1="620" y1="280" x2="900" y2="280" stroke="#C98A00" stroke-width="1"/><text x="632" y="298" font-size="12" fill="#2A3040">Необязательный. Смысловой поиск</text><text x="632" y="314" font-size="12" fill="#2A3040">и подсказки связей. Ключ нейросети</text><text x="632" y="330" font-size="12" fill="#2A3040">только на устройстве. Каждое</text><text x="632" y="346" font-size="12" fill="#2A3040">предложение подтверждает человек</text><rect x="620" y="388" width="280" height="90" rx="10" fill="#FFEFC9" stroke="#C98A00" stroke-width="1.6"/><text x="632" y="410" font-size="15" font-weight="700" fill="#1F2430">Синхронизация</text><line x1="620" y1="418" x2="900" y2="418" stroke="#C98A00" stroke-width="1"/><text x="632" y="436" font-size="12" fill="#2A3040">Журнал изменений, разбор</text><text x="632" y="452" font-size="12" fill="#2A3040">конфликтов, вход через Google.</text><text x="632" y="468" font-size="12" fill="#2A3040">Изменения копятся без интернета</text><rect x="620" y="530" width="280" height="74" rx="10" fill="#D8F1EA" stroke="#1F8F72" stroke-width="1.6"/><text x="632" y="552" font-size="15" font-weight="700" fill="#1F2430">Шифрование</text><line x1="620" y1="560" x2="900" y2="560" stroke="#1F8F72" stroke-width="1"/><text x="632" y="578" font-size="12" fill="#2A3040">Web Crypto, AES-GCM. Ключ из</text><text x="632" y="594" font-size="12" fill="#2A3040">пароля защиты, только на устройстве</text><rect x="1010" y="250" width="300" height="74" rx="10" fill="#FFEFC9" stroke="#C98A00" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1022" y="272" font-size="15" font-weight="700" fill="#1F2430">Нейросеть</text><text x="1298" y="272" text-anchor="end" font-size="11" fill="#4A5160">снаружи</text><line x1="1010" y1="280" x2="1310" y2="280" stroke="#C98A00" stroke-width="1"/><text x="1022" y="298" font-size="12" fill="#2A3040">По ключу пользователя</text><text x="1022" y="314" font-size="12" fill="#2A3040">Нужен интернет</text><rect x="1010" y="530" width="300" height="90" rx="10" fill="#FFEFC9" stroke="#C98A00" stroke-width="1.6"/><text x="1022" y="552" font-size="15" font-weight="700" fill="#1F2430">Google Диск пользователя</text><text x="1298" y="552" text-anchor="end" font-size="11" fill="#4A5160">снаружи</text><line x1="1010" y1="560" x2="1310" y2="560" stroke="#C98A00" stroke-width="1"/><text x="1022" y="578" font-size="12" fill="#2A3040">Скрытая папка приложения</text><text x="1022" y="594" font-size="12" fill="#2A3040">Видит только шифр</text><text x="1022" y="610" font-size="12" fill="#2A3040">Нужен интернет</text><path d="M320 202 V250" fill="none" stroke="#4A5160" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M320 340 V388" fill="none" stroke="#4A5160" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M580 300 H620" fill="none" stroke="#4A5160" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M580 445 H620" fill="none" stroke="#4A5160" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="600" y="437" text-anchor="middle" font-size="11" fill="#4A5160"></text><path d="M760 498 V530" fill="none" stroke="#4A5160" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M900 300 H1010" fill="none" stroke="#4A5160" stroke-width="1.6" stroke-dasharray="5 4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="955" y="292" text-anchor="middle" font-size="11" fill="#4A5160">интернет</text><path d="M900 575 H1010" fill="none" stroke="#4A5160" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="955" y="567" text-anchor="middle" font-size="11" fill="#4A5160">интернет</text><text x="600" y="284" text-anchor="middle" font-size="11" fill="#4A5160"></text><line x1="30" y1="662" x2="1310" y2="662" stroke="#C9CED8" stroke-width="1"/><text x="30" y="684" font-size="13" font-weight="700" fill="#1F2430">Ограничения проекта</text><rect x="30" y="696" width="240" height="40" rx="10" fill="#F2F3F6" stroke="#6B7380" stroke-width="1.4"/><text x="150" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2430">Бесплатно</text><rect x="288" y="696" width="240" height="40" rx="10" fill="#F2F3F6" stroke="#6B7380" stroke-width="1.4"/><text x="408" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2430">Без своего сервера</text><rect x="546" y="696" width="240" height="40" rx="10" fill="#F2F3F6" stroke="#6B7380" stroke-width="1.4"/><text x="666" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2430">Работа без интернета</text><rect x="804" y="696" width="240" height="40" rx="10" fill="#F2F3F6" stroke="#6B7380" stroke-width="1.4"/><text x="924" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2430">Один код для телефона и ПК</text><rect x="1062" y="696" width="240" height="40" rx="10" fill="#F2F3F6" stroke="#6B7380" stroke-width="1.4"/><text x="1182" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2430">Данные у пользователя</text><rect x="30" y="770" width="16" height="16" rx="3" fill="#D8F1EA" stroke="#1F8F72" stroke-width="1.4"/><text x="52" y="783" font-size="12" fill="#3A4150">работает без интернета</text><rect x="225" y="770" width="16" height="16" rx="3" fill="#FFEFC9" stroke="#C98A00" stroke-width="1.4"/><text x="247" y="783" font-size="12" fill="#3A4150">нужен интернет</text><rect x="367" y="770" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#6B7380" stroke-width="1.4" stroke-dasharray="4 3"/><text x="389" y="783" font-size="12" fill="#3A4150">пунктир: необязательно</text></svg>