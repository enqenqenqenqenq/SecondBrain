<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 790" width="1340" height="790" font-family="Segoe UI, Arial, sans-serif"><defs><clipPath id="cp1"><rect x="30" y="100" width="280" height="560" rx="26"/></clipPath><clipPath id="cp2"><rect x="350" y="100" width="280" height="560" rx="26"/></clipPath><clipPath id="cp3"><rect x="670" y="100" width="280" height="560" rx="26"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5160"/></marker></defs><rect width="1340" height="790" fill="#FFFFFF"/><text x="30" y="30" font-size="16" font-weight="700" fill="#1F2430" text-anchor="start">Макет экрана быстрой записи (телефон)</text><text x="30" y="48" font-size="12" font-weight="400" fill="#4A5160" text-anchor="start">Один экран: поле и кнопка. Обязательных полей нет, достаточно текста.</text><text x="30" y="88" font-size="13" font-weight="700" fill="#1F2430" text-anchor="start">1. Открыли</text><text x="350" y="88" font-size="13" font-weight="700" fill="#1F2430" text-anchor="start">2. Написали</text><text x="670" y="88" font-size="13" font-weight="700" fill="#1F2430" text-anchor="start">3. Сохранили</text><rect x="30" y="100" width="280" height="560" rx="26" fill="#FFFFFF" stroke="#1F2430" stroke-width="3"/><text x="48" y="124" font-size="11" font-weight="600" fill="#1F2430" text-anchor="start">13:45</text><rect x="266" y="115" width="24" height="10" rx="3" fill="none" stroke="#1F2430" stroke-width="1.2"/><text x="46" y="156" font-size="15" font-weight="700" fill="#1F2430" text-anchor="start">Быстрая запись</text><rect x="46" y="170" width="248" height="140" rx="10" fill="#FFFFFF" stroke="#3B6FD4" stroke-width="2"/><line x1="58" y1="188" x2="58" y2="208" stroke="#3B6FD4" stroke-width="2"/><text x="66" y="203" font-size="14" font-weight="400" fill="#9AA1AE" text-anchor="start">Заметка</text><rect x="46" y="322" width="150" height="26" rx="13" fill="#F2F3F6" 