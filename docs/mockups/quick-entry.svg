/text><rect x="366" y="170" width="248" height="140" rx="10" fill="#FFFFFF" stroke="#3B6FD4" stroke-width="2"/><text x="378" y="203" font-size="14" font-weight="400" fill="#1F2430" text-anchor="start">Позвонить Ане после пар</text><line x1="562" y1="188" x2="562" y2="208" stroke="#3B6FD4" stroke-width="2"/><rect x="366" y="322" width="150" height="26" rx="13" fill="#F2F3F6" stroke="#C9CED8" stroke-width="1"/><text x="378" y="339" font-size="12" font-weight="400" fill="#6B7380" text-anchor="start">Сегодня, 13:45</text><rect x="366" y="364" width="248" height="48" rx="12" fill="#3B6FD4" stroke="none" stroke-width="0"/><text x="490" y="394" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Сохранить</text><g clip-path="url(#cp2)"><rect x="350" y="430" width="280" height="230" rx="0" fill="#E7E9EE" stroke="none" stroke-width="1.5"/><rect x="366.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="391.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="416.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="441.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="466.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="491.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="516.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="541.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="566.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="591.5" y="444" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="379.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="404.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="429.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="454.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="479.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="504.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="529.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="554.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="579.0" y="488" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="404.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="429.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="454.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="479.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="504.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="529.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="554.0" y="532" width="22" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="366" y="576" width="40" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="412" y="576" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/><rect x="574" y="576" width="40" height="36" rx="5" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1"/></g><rect x="350" y="100" width="280" height="560" rx="26" fill="none" stroke="#1F2430" stroke-width="3"/><rect x="670" y="100" width="280" height="560" rx="26" fill="#FFFFFF" stroke="#1F2430" stroke-width="3"/><text x="688" y="124" font-size="11" font-weight="600" fill="#1F2430" text-anchor="start">13:45</text><rect x="906" y="115" width="24" height="10" rx="3" fill="none" stroke="#1F2430" stroke-width="1.2"/><text x="686" y="156" font-size="15" font-weight="700" fill="#1F2430" text-anchor="start">Быстрая запись</text><rect x="686" y="170" width="248" height="140" rx="10" fill="#FFFFFF" stroke="#C9CED8" stroke-width="1.5"/><text x="698" y="203" font-size="14" font-weight="400" fill="#9AA1AE" text-anchor="start">Заметка</text><rect x="686" y="322" width="150" height="26" rx="13" fill="#F2F3F6" stroke="#C9CED8" stroke-width="1"/><text x="698" y="339" font-size="12" font-weight="400" fill="#6B7380" text-anchor="start">Сегодня, 13:45</text><rect x="686" y="364" width="248" height="48" rx="12" fill="#E1E4EA" stroke="none" stroke-width="0"/><text x="810" y="394" font-size="16" font-weight="700" fill="#A6ACB8" text-anchor="middle">Сохранить</text><g clip-path="url(#cp3)"><rect x="686" y="430" width="248" height="40" rx="10" fill="#1F2430" stroke="none" stroke-width="1.5"/><text x="700" y="455" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start">Записано</text><text x="920" y="455" font-size="13" font-weight="700" fill="#9DB8F5" text-anchor="end">Отменить</text><rect x="670" y="596" width="280" height="64" rx="0" fill="#F7F8FA" stroke="#C9CED8" stroke-width="1"/><line x1="670" y1="596" x2="950" y2="596" stroke="#C9CED8" stroke-width="1"/><circle cx="698" cy="618" r="9" fill="#3B6FD4"/><text x="698" y="648" font-size="9" font-weight="700" fill="#3B6FD4" text-anchor="middle">Запись</text><circle cx="754" cy="618" r="9" fill="#D5D9E1"/><text x="754" y="648" font-size="9" font-weight="400" fill="#6B7380" text-anchor="middle">Лента</text><circle cx="810" cy="618" r="9" fill="#D5D9E1"/><text x="810" y="648" font-size="9" font-weight="400" fill="#6B7380" text-anchor="middle">Досье</text><circle cx="866" cy="618" r="9" fill="#D5D9E1"/><text x="866" y="648" font-size="9" font-weight="400" fill="#6B7380" text-anchor="middle">План</text><circle cx="922" cy="618" r="9" fill="#D5D9E1"/><text x="922" y="648" font-size="9" font-weight="400" fill="#6B7380" text-anchor="middle">Настройки</text></g><rect x="670" y="100" width="280" height="560" rx="26" fill="none" stroke="#1F2430" stroke-width="3"/><path d="M316 388 H344" stroke="#4A5160" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M636 388 H664" stroke="#4A5160" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><circle cx="294" cy="170" r="11" fill="#C98A00" stroke="#FFFFFF" stroke-width="2"/><text x="294" y="174" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="614" cy="170" r="11" fill="#C98A00" stroke="#FFFFFF" stroke-width="2"/><text x="614" y="174" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="620" cy="388" r="11" fill="#C98A00" stroke="#FFFFFF" stroke-width="2"/><text x="620" y="392" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="202" cy="335" r="11" fill="#C98A00" stroke="#FFFFFF" stroke-width="2"/><text x="202" y="339" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="934" cy="430" r="11" fill="#C98A00" stroke="#FFFFFF" stroke-width="2"/><text x="934" y="434" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="940" cy="596" r="11" fill="#C98A00" stroke="#FFFFFF" stroke-width="2"/><text x="940" y="600" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="1010" cy="118" r="11" fill="#C98A00"/><text x="1010" y="122" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1032" y="122" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Поле в фокусе сразу, клавиатура уже</text><text x="1032" y="138" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">открыта. Ничего нажимать перед вводом не</text><text x="1032" y="154" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">нужно.</text><circle cx="1010" cy="208" r="11" fill="#C98A00"/><text x="1010" y="212" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1032" y="212" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Обязательных полей нет, только текст.</text><text x="1032" y="228" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Людей, места и теги можно добавить</text><text x="1032" y="244" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">позже, на экране дополнения.</text><circle cx="1010" cy="298" r="11" fill="#C98A00"/><text x="1010" y="302" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1032" y="302" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Кнопка серая, пока поле пустое. С любым</text><text x="1032" y="318" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">непустым текстом становится активной.</text><circle cx="1010" cy="372" r="11" fill="#C98A00"/><text x="1010" y="376" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1032" y="376" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Время ставится само, с точностью до</text><text x="1032" y="392" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">минуты. Изменить можно позже.</text><circle cx="1010" cy="446" r="11" fill="#C98A00"/><text x="1010" y="450" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1032" y="450" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">После сохранения поле очищается. Запись</text><text x="1032" y="466" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">уже лежит на устройстве, интернет не</text><text x="1032" y="482" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">нужен.</text><circle cx="1010" cy="536" r="11" fill="#C98A00"/><text x="1010" y="540" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1032" y="540" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Нижнее меню: Запись, Лента, Досье, План,</text><text x="1032" y="556" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">Настройки. Видно, когда клавиатура</text><text x="1032" y="572" font-size="12" font-weight="400" fill="#2A3040" text-anchor="start">закрыта.</text><rect x="30" y="700" width="1280" height="54" rx="10" fill="#F2F3F6" stroke="#6B7380" stroke-width="1.4"/><text x="46" y="722" font-size="13" font-weight="700" fill="#1F2430" text-anchor="start">Цель: от открытия до сохранения две секунды. Открыл, написал, нажал «Сохранить».</text><text x="46" y="742" font-size="12" font-weight="400" fill="#4A5160" text-anchor="start">На компьютере тот же экран, по центру страницы, поле в фокусе сразу.</text></svg>